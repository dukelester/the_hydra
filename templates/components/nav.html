{% load static %}
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{% url 'core:home' %}">
      <img class="brand-mark" src="{% static 'img/mark.png' %}" alt="" width="40" height="40">
      <span class="brand-name">H.Y.D.R.A.</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="{% url 'projects:list' %}">Explore Projects</a>
      <a href="{% url 'institutions:list' %}">Institutions</a>
      <a href="{% url 'policies:list' %}">Policies</a>
      <a href="{% url 'core:what-hydra-means' %}">What H.Y.D.R.A. means</a>
      <a href="{% url 'core:how-it-works' %}">How It Works</a>
      {% if user.is_authenticated %}
        <a href="{% url 'investigations:list' %}">My Investigations</a>
        <a href="{% url 'reports:list' %}">My Reports</a>
        {% if user.is_staff %}
          <a href="{% url 'admin:index' %}">Admin</a>
        {% endif %}
        <form class="nav-form" method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="nav-button">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">Log in</a>
      {% endif %}
    </nav>
  </div>
</header>
