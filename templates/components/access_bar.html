{% load i18n %}
<div class="access-bar">
  <form class="lang-switch" method="post" action="{% url 'set_language' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <label for="{{ language_field_id|default:'language-select' }}">{% trans "Language" %}</label>
    <select id="{{ language_field_id|default:'language-select' }}" name="language">
      {% get_current_language as LANGUAGE_CODE %}
      {% get_available_languages as LANGUAGES %}
      {% for code, name in LANGUAGES %}
        <option value="{{ code }}"{% if code == LANGUAGE_CODE %} selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
    <button type="submit">{% trans "Apply" %}</button>
  </form>

  <form class="lite-switch" method="post" action="{% url 'core:lite' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% if hydra_lite %}
      <input type="hidden" name="lite" value="0">
      <button type="submit">{% trans "Use full pages" %}</button>
    {% else %}
      <input type="hidden" name="lite" value="1">
      <button type="submit">{% trans "Use less data" %}</button>
    {% endif %}
  </form>
</div>
