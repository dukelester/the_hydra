{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block content %}
<section class="prose">
  <h1>Search</h1>
  <form class="search-form" method="get" action="{% url 'core:search' %}" role="search">
    <label for="q">Search projects, institutions, policies, and documents</label>
    <input id="q" name="q" type="search" value="{{ query }}" placeholder="Search projects, institutions, policies..." autocomplete="off" hx-get="{% url 'core:search' %}" hx-trigger="keyup changed delay:300ms, search" hx-target="#search-results" hx-swap="innerHTML">
    <button type="submit" class="btn btn-primary">Search</button>
  </form>
  <div id="search-results" class="search-results" aria-live="polite">
    {% include "components/search_results.html" %}
  </div>
</section>
{% endblock %}
